{% extends "base.html" %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card border-danger shadow-sm">
        <div class="card-body">
          <h1 class="h4">Удалить тур?</h1>
          <p>Предложение «{{ tour.title }}» будет удалено вместе со всеми отзывами. Действие необратимо.</p>

          <form method="post">
            {% csrf_token %}
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-danger">Удалить</button>
              <a href="{{ tour.get_absolute_url }}" class="btn btn-outline-secondary">Отмена</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
