{% extends "base.html" %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <h1 class="h3 mb-4">{{ page_title }}</h1>

      <form method="post" enctype="multipart/form-data" novalidate>
        {% csrf_token %}

        {% if form.non_field_errors %}
          <div class="alert alert-danger">{{ form.non_field_errors }}</div>
        {% endif %}

        {% for field in form %}
          <div class="mb-3">
            <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}<div class="text-danger small mt-1">{{ field.errors|join:" " }}</div>{% endif %}
          </div>
        {% endfor %}

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-brand">{{ submit_label }}</button>
          <a href="{% if tour %}{{ tour.get_absolute_url }}{% else %}{% url 'tours:tour_list' %}{% endif %}"
             class="btn btn-outline-secondary">Отмена</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
