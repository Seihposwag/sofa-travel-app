{% load static %}
<div class="col-12 col-sm-6 col-lg-4">
  <article class="card h-100 shadow-sm tour-card">
    {% if tour.photo %}
      <img src="{{ tour.photo.url }}" class="card-img-top tour-card__img" alt="{{ tour.title }}">
    {% else %}
      <img src="{% static 'images/hero-beach.jpg' %}" class="card-img-top tour-card__img" alt="{{ tour.title }}">
    {% endif %}

    <div class="card-body d-flex flex-column">
      <a href="{{ tour.country.get_absolute_url }}" class="badge text-bg-light align-self-start mb-2 text-decoration-none">
        {{ tour.country.title }}
      </a>
      <h2 class="card-title h5">
        <a href="{{ tour.get_absolute_url }}" class="text-decoration-none link-dark">{{ tour.title }}</a>
      </h2>
      <p class="card-text text-secondary small flex-grow-1">{{ tour.description|truncatewords:18 }}</p>

      <div class="d-flex justify-content-between align-items-center mt-2">
        <span class="fw-bold text-brand">{{ tour.price|floatformat:0 }} ₽</span>
        <span class="text-secondary small">{{ tour.duration_days }} дн.</span>
      </div>
    </div>

    <div class="card-footer bg-white text-secondary small">Отзывов: {{ tour.reviews.count }}</div>
  </article>
</div>
